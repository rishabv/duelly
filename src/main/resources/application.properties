server.port = 9000
spring.datasource.url=jdbc:mysql://localhost:3306/duelly
spring.datasource.username=root
spring.datasource.password=12369870
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
app.jwt-secret=duellySpringSecretKey

spring.output.ansi.enabled = always
logging.file.name = loggers.logm

# below line is for adding logs in a specific pattern inside the log file.
logging.pattern.file = %d{yyyy-MM-dd} [%level] %c{1.} [%t] %m%n
springfox.documentation.swagger-ui.enabled=true
#springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui-custom.html
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# kafka configurations
spring.kafka.bootstrap-servers=localhost:9092
app.kafka.topics.notifications=notifications.events.v1
app.kafka.topics.retry=notifications.retry.v1
app.kafka.topics.dlq= notifications.dlq.v1

management.endpoints.web.base-path=/api/v1/actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics,loggers,threaddump,env,configprops
#management.endpoint.health.show-details=ALWAYS
management.server.port=8081
management.endpoint.health.show-details=when_authorized


# Micrometer Prometheus
spring.application.name=my-app
management.metrics.tags.application=duelly
